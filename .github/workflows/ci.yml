name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: quality (fmt, clippy, docs, deps, web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Phone protocol tests
        run: node --test tests/remote_web.mjs
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Rustdoc (deny warnings)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --offline --no-deps
      - name: Single crossterm version
        run: |
          cargo tree --locked --offline -p crossterm
          test "$(cargo tree --locked --offline -p crossterm | grep -c '^crossterm v')" -eq 1

  test:
    name: clippy and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      # Platform-only code is linted where it compiles.
      - name: Clippy (deny warnings)
        run: cargo clippy --locked --offline --all-targets -- -D warnings
      - name: Run offline tests
        run: cargo test --locked --offline --all-targets

  package:
    name: package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          rustflags: ""
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage
        id: stage
        shell: bash
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          name="minicore-tui-$version-${{ matrix.target }}"
          # The executable sits in bin/; the TUI directory is chosen with --home or MINICORE_HOME.
          mkdir -p "$name/bin" "$name/docs"
          cp "target/${{ matrix.target }}/release/minicore-tui$EXE" "$name/bin/"
          cp README.md CHANGELOG.md "$name/"
          cp docs/configuration.md "$name/docs/"
          # The built-in Agent and its Runtime, as Cargo.lock pins them.
          {
            echo "minicore-tui $version $GITHUB_SHA"
            sed -n 's|^source = "git+.*/\(minicore-[a-z]*\)?tag=\(.*\)#\([0-9a-f]*\)"$|\1 \2 \3|p' Cargo.lock
          } > "$name/BUILD.txt"
          # A tarball keeps the executable bits, which artifact zips drop.
          if [ -z "$EXE" ]; then
            tar -czf "$name.tar.gz" "$name"
            echo "path=$name.tar.gz" >> "$GITHUB_OUTPUT"
          else
            echo "path=$name" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error

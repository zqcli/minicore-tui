[package]
name = "render-analysis"
version = "0.0.0"
edition = "2024"

[dependencies]
minicore-tui = { path = "../minicore-tui" }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.minicore-tui]
opt-level = 1

[profile.release]
debug = 1

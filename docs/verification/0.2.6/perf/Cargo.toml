[package]
name = "render-analysis"
version = "0.0.0"
edition = "2024"

[dependencies]
minicore-tui = { path = "../../../.." }
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = "=0.28.1"
serde_json = "1"

# Simulate the product's proposed dependency-only optimization. The TUI is a
# dependency in this probe, so explicitly keep it at the product's dev level.
[profile.deps]
inherits = "dev"

[profile.deps.package."*"]
opt-level = 2

[profile.deps.package.minicore-tui]
opt-level = 0

[profile.release]
debug = 1

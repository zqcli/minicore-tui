<section id="signin" class="screen" hidden>
  <div class="col">
    <img class="appicon" src="/icon.svg" alt="" width="72" height="72">
    <h1>Connect to MiniCore</h1>
    <p class="sub">on <b id="shost"></b></p>
    <div id="snote" class="note" role="status" hidden><svg viewBox="0 0 24 24" class="ic sm"><use href="#i-info"/></svg><span></span></div>
    <form id="sf" novalidate>
      <label for="pw">Password</label>
      <div class="field" id="pwf">
        <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="xxxx-xxxx-xxxx" aria-describedby="serr shelp">
        <button type="button" id="pweye" class="ib" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" class="ic"><use href="#i-eye"/></svg></button>
      </div>
      <div id="serr" class="ferr" role="alert" hidden></div>
      <button id="sgo" class="btn primary block" type="submit"><span class="spin" hidden></span><span>Connect</span></button>
      <p class="help" id="shelp">The password is shown on your computer's MiniCore screen.</p>
    </form>
  </div>
</section>

<section id="gate" class="screen" hidden></section>

<div id="app" hidden>
  <nav id="nav" aria-label="Sessions" tabindex="-1"></nav>
  <div id="main">
    <header class="bar" id="bar">
      <button id="menu" class="ib" type="button" aria-label="Sessions" aria-haspopup="dialog"><svg viewBox="0 0 24 24" class="ic"><use href="#i-menu"/></svg></button>
      <div id="ttl"><h1><button id="title" type="button" aria-haspopup="dialog">MiniCore</button></h1><div id="sub"></div></div>
      <button id="newb" class="ib" type="button" aria-label="New session"><svg viewBox="0 0 24 24" class="ic"><use href="#i-compose"/></svg></button>
      <button id="moreb" class="ib" type="button" aria-label="Session menu" aria-haspopup="dialog"><svg viewBox="0 0 24 24" class="ic"><use href="#i-more"/></svg></button>
    </header>
    <div id="banners"></div>
    <div id="findbar"></div>
    <div id="mid">
      <main id="log" aria-label="Conversation">
        <div id="col">
          <div id="top"></div>
          <div id="blocks"></div>
          <div id="empty" hidden></div>
        </div>
      </main>
      <div id="toasts"></div>
    </div>
    <footer id="dock">
      <button id="newout" class="pill" type="button" hidden><svg viewBox="0 0 24 24" class="ic sm"><use href="#i-down"/></svg>New output</button>
      <div id="apprbar" role="alert" hidden></div>
      <div id="strip" hidden></div>
      <div id="tray"></div>
      <div id="pop" role="listbox" aria-label="Suggestions" hidden></div>
      <form id="comp">
        <textarea id="ta" rows="1" placeholder="Message MiniCore" aria-label="Message" enterkeyhint="send" autocapitalize="sentences" aria-autocomplete="list" aria-controls="pop"></textarea>
        <div class="chips" id="chips"></div>
      </form>
    </footer>
  </div>
</div>
<div id="scrim"></div>
<div id="layer"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script type="module" src="/main.js"></script>
</body>
</html>

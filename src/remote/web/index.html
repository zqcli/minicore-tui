<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `default` keeps the page below the iOS status bar; `black-translucent` would draw white status text over the light theme. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiniCore">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tc" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcd" content="#0e0e10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>MiniCore</title>
<style>
:root{
  --bg:#fff;--bg2:#f6f6f8;--sf:#fff;--fill:#f0f0f3;--fill2:#e6e6ea;--line:#e6e6eb;--line2:rgba(17,19,24,.14);
  --tx:#111318;--tx2:#464a52;--tx3:#62666f;--ac:#2560e8;--ac2:#1d4fc4;--acs:#e9effd;--on:#fff;
  --ok:#11793b;--oks:#e5f4ea;--wa:#8a5000;--wac:#c77800;--was:#fbf0db;--er:#c8303a;--ers:#fbe9ea;
  --ub:#edf1fd;--scrim:rgba(10,12,16,.4);--sh:0 10px 30px rgba(17,19,24,.12),0 1px 3px rgba(17,19,24,.06);--csh:0 2px 12px rgba(17,19,24,.07);
  --add:#e3f4e8;--del:#fbe8e9;--addt:#0d6b33;--delt:#b0262d;--hl:rgba(255,196,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --t12:.75rem;--t13:.8125rem;--t14:.875rem;--t16:1rem;--t18:1.125rem;--t22:1.375rem;
  --r1:8px;--r2:12px;--r3:20px;--ease:cubic-bezier(.2,.8,.2,1);--fast:.15s;--slow:.25s;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
  color-scheme:light
}
[data-theme=dark]{color-scheme:dark;
  --bg:#0e0e10;--bg2:#18181b;--sf:#18181b;--fill:#222226;--fill2:#2c2c31;--line:#2a2a2f;--line2:rgba(255,255,255,.16);
  --tx:#ececee;--tx2:#c2c4ca;--tx3:#989ba3;--ac:#7ea3ff;--ac2:#a0bbff;--acs:#1a2238;
  --ok:#4fd18b;--oks:#15291e;--wa:#f2b84f;--wac:#f2b84f;--was:#2b2314;--er:#ff7a7a;--ers:#2e1a1c;
  --ub:#1e2433;--scrim:rgba(0,0,0,.58);--sh:0 12px 36px rgba(0,0,0,.55),0 1px 3px rgba(0,0,0,.4);--csh:none;
  --add:#173323;--del:#3a1d21;--addt:#7fe0a8;--delt:#ff9a9a;--hl:rgba(255,196,0,.35)
}
html{font-size:calc(16px * var(--ts,1))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button,.bar,.chips,.shead,.nhead,.nfoot,.sec{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font:var(--t16)/1.5 var(--font)}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;border-radius:0;touch-action:manipulation;text-align:inherit}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:var(--r1)}
input:focus-visible,textarea:focus-visible,[tabindex="-1"]:focus-visible{outline:none}
input::-ms-reveal,input::-ms-clear{display:none}
h1,h2,h3,p{margin:0}
code,pre,.mono{font-family:var(--mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none;display:block}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:28px;height:28px}
.spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;opacity:.8}
.spin.sm{width:12px;height:12px;border-width:1.75px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
@keyframes pulse{50%{transform:scale(1.25)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r2);font-size:var(--t16);font-weight:600;background:var(--fill);color:var(--tx);transition:background var(--fast),opacity var(--fast),transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--ac);color:var(--on)}
[data-theme=dark] .btn.primary{background:#3b68e6}
.btn.danger{background:none;color:var(--er);box-shadow:inset 0 0 0 1.5px var(--er)}
.btn.dangerfill{background:var(--er);color:#fff}
[data-theme=dark] .btn.dangerfill{background:#d33c45}
.btn.ghost{background:none;color:var(--ac);font-weight:500}
.btn.block{width:100%;min-height:50px}
.btn.sm{min-height:36px;padding:0 12px;font-size:var(--t14);border-radius:var(--r1)}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:var(--r2);color:var(--tx);flex:none;position:relative;transition:background var(--fast)}
.ib:active,.ib[aria-expanded=true]{background:var(--fill)}
.ib.s{width:36px;height:36px;border-radius:var(--r1)}
.ib.s::after{content:"";position:absolute;inset:-4px}
.seg{display:flex;gap:2px;padding:2px;border-radius:var(--r2);background:var(--fill);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:40px;padding:0 12px;border-radius:10px;font-size:var(--t14);font-weight:500;color:var(--tx2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background var(--fast),color var(--fast)}
.seg button[aria-checked=true]{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .seg button[aria-checked=true]{background:var(--fill2)}
input.tf{width:100%;min-height:44px;padding:0 12px;border-radius:var(--r2);border:1px solid var(--line2);background:var(--sf);font-size:max(16px,1rem);color:var(--tx)}
input.tf:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
.muted{color:var(--tx3);font-size:var(--t14);padding:16px 4px;text-align:center}
.hint{color:var(--tx3);font-size:var(--t13);line-height:1.45}
.hint.warn{color:var(--wa)}
.badge{display:inline-flex;align-items:center;gap:4px;min-height:20px;padding:0 7px;border-radius:10px;font-size:var(--t12);font-weight:600;background:var(--fill);color:var(--tx2);white-space:nowrap}
.badge.warn{background:var(--was);color:var(--wa)}
.serr{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r2);background:var(--ers);color:var(--er);font-size:var(--t14);line-height:1.4}
.serr .ic{margin-top:2px}

/* screens */
.screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:calc(var(--st) + 24px) calc(var(--sr) + 24px) calc(var(--sb) + 24px) calc(var(--sl) + 24px);background:var(--bg)}
.screen>.col{width:100%;max-width:360px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise var(--slow) var(--ease)}
.appicon{width:72px;height:72px;border-radius:18px;box-shadow:0 0 0 .5px var(--line2),0 8px 24px rgba(37,96,232,.22);margin-bottom:24px}
.screen h1{margin:0 0 6px;font-size:var(--t22);line-height:1.25;font-weight:600}
.screen .sub{color:var(--tx2);font-size:var(--t16);overflow-wrap:anywhere}
.screen .sub b{color:var(--tx);font-weight:600}
.note{display:flex;gap:8px;align-items:flex-start;text-align:left;width:100%;margin-top:24px;padding:12px 14px;border-radius:var(--r2);background:var(--acs);color:var(--tx);font-size:var(--t14);line-height:1.4}
.note .ic{color:var(--ac);margin-top:1px}
#sf{width:100%;margin-top:32px;text-align:left}
#sf label{display:block;font-size:var(--t13);font-weight:600;color:var(--tx2);margin:0 0 6px 4px}
.field{display:flex;align-items:center;height:54px;border-radius:14px;border:1px solid var(--line2);background:var(--sf);transition:border-color var(--fast),box-shadow var(--fast)}
.field:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.field.bad{border-color:var(--er);box-shadow:0 0 0 4px var(--ers)}
.field.shake{animation:shake .32s ease}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 0 0 16px;font-size:max(17px,1rem);letter-spacing:.02em}
.field input::placeholder{color:var(--tx3);letter-spacing:0}
.field .ib{color:var(--tx3);margin-right:5px}
.ferr{display:flex;gap:6px;align-items:center;margin:8px 4px 0;font-size:var(--t14);line-height:1.4;color:var(--er)}
.ferr.warn{color:var(--wa)}
.ferr button{color:var(--ac);font-weight:600;margin-left:auto;min-height:44px;padding:0 4px 0 8px}
#sgo{margin-top:24px}
.help{margin:16px 4px 0;font-size:var(--t13);line-height:1.45;color:var(--tx3);text-align:center}
.eicon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--fill);color:var(--tx2);margin-bottom:24px}
.eicon.warn{background:var(--was);color:var(--wa)}
.gate-acts{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:32px}
.screen .spin{width:22px;height:22px;color:var(--tx3);margin-top:24px}

/* app frame */
/* absolute, not fixed: the drawer inside must stack above the scrim */
#app{position:absolute;top:0;left:0;right:0;height:var(--h,100dvh);display:flex}
#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.bar{flex:none;display:flex;align-items:center;gap:2px;height:calc(var(--st) + 52px);padding:var(--st) calc(var(--sr) + 6px) 0 calc(var(--sl) + 6px);background:var(--bg);border-bottom:1px solid transparent;transition:border-color var(--fast);z-index:5}
.bar.edge{border-bottom-color:var(--line)}
#menu .dotn{position:absolute;top:5px;right:3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--wac);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center;box-shadow:0 0 0 2px var(--bg)}
[data-theme=dark] #menu .dotn{color:#1a1206}
#menu .dotn.pop{animation:pulse .3s var(--ease) 2}
#ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;position:relative;padding:0 4px}
#ttl h1{max-width:100%;font-size:var(--t16);font-weight:600;line-height:1.3;display:flex}
#title{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:22px}
#title::after{content:"";position:absolute;inset:-6px 0}
#sub{max-width:100%;font-size:var(--t12);line-height:1.35;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner{flex:none;display:flex;align-items:center;gap:8px;min-height:40px;padding:6px calc(var(--sr) + 8px) 6px calc(var(--sl) + 16px);font-size:var(--t14);line-height:1.35;background:var(--fill);color:var(--tx2);animation:fade var(--fast)}
.banner>span{flex:1;min-width:0}
.banner.warn{background:var(--was);color:var(--wa)}
.banner .btn{min-height:32px}
#mid{flex:1;min-height:0;position:relative}
#log{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:8px calc(var(--sr) + 16px) 24px calc(var(--sl) + 16px)}
#col{max-width:780px;margin:0 auto;display:flex;flex-direction:column}
#blocks{display:flex;flex-direction:column}
#top{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
#top:not(:empty){padding:4px 0 12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:18px;background:var(--fill);color:var(--tx2);font-size:var(--t14);font-weight:500}
.pill::after{content:"";position:absolute;inset:-4px 0}
.pill{position:relative}
#toasts{position:absolute;left:0;right:0;bottom:8px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:8px;max-width:min(560px,100%);min-height:44px;padding:6px 6px 6px 14px;border-radius:var(--r2);background:var(--tx);color:var(--bg);font-size:var(--t14);line-height:1.35;box-shadow:var(--sh);animation:rise var(--fast) var(--ease)}
.toast>span{flex:1;min-width:0;padding:4px 8px 4px 0}
.toast.error{background:var(--sf);color:var(--er);box-shadow:var(--sh),inset 0 0 0 1px var(--line)}
.toast .tact{min-height:36px;padding:0 12px;border-radius:var(--r1);font-weight:600;color:inherit;background:rgba(127,127,127,.18)}
.toast .ib{width:36px;height:36px;color:inherit}

/* navigation: drawer on phones, sidebar from 900 px */
#nav{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(86vw,340px);height:var(--h,100dvh);display:flex;flex-direction:column;background:var(--bg);padding:var(--st) 0 0 var(--sl);box-shadow:var(--sh);transform:translateX(-102%);visibility:hidden;transition:transform var(--slow) var(--ease),visibility 0s var(--slow)}
#nav.on{transform:none;visibility:visible;transition:transform var(--slow) var(--ease),visibility 0s}
.nhead{display:flex;align-items:center;gap:10px;padding:10px 6px 6px 16px}
.nhead img{width:30px;height:30px;border-radius:8px}
.nhead>div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.nhead b{font-size:var(--t16);font-weight:600}
.nhead small{font-size:var(--t12);color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nnew{margin:6px 12px 8px}
.search{display:flex;align-items:center;gap:8px;margin:0 12px 4px;padding:0 12px;min-height:44px;border-radius:var(--r2);background:var(--fill);color:var(--tx3)}
.search input{flex:1;min-width:0;border:0;background:none;font-size:max(16px,1rem);color:var(--tx);height:44px}
.search input::placeholder{color:var(--tx3)}
.nlist{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 8px 12px}
.sec{display:flex;align-items:center;gap:8px;padding:16px 10px 6px;font-size:var(--t13);font-weight:600;color:var(--tx3)}
.sec.warn{color:var(--wa)}
.srow{display:flex;align-items:center;border-radius:var(--r2);position:relative}
.srow.cur{background:var(--fill)}
.sopen{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 0 8px 10px;border-radius:var(--r2)}
.sopen:active{background:var(--fill)}
.sst{width:20px;height:20px;flex:none;display:grid;place-items:center;color:var(--tx3)}
.sst.warn{color:var(--wac)}
.sst.er{color:var(--er)}
.sst .ndot{width:8px;height:8px;border-radius:50%;background:var(--ac)}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rm{font-size:var(--t16);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs{font-size:var(--t13);color:var(--tx3);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs .warn{color:var(--wa);font-weight:600}
.rs .er{color:var(--er);font-weight:600}
.srow .more{color:var(--tx3)}
.nfoot{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 16px calc(var(--sb) + 4px);border-top:1px solid var(--line);font-size:var(--t13);color:var(--tx3)}
.nfoot span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.cdot.off{background:var(--wac)}
#scrim{position:fixed;inset:0;z-index:19;background:var(--scrim);opacity:0;visibility:hidden;transition:opacity var(--slow),visibility 0s var(--slow)}
#scrim.on{opacity:1;visibility:visible;transition:opacity var(--slow)}

/* sheets: bottom sheets on phones, dialogs or a side panel on wide screens */
.sheet{position:fixed;z-index:30;left:0;right:0;bottom:var(--kb,0px);margin:0 auto;max-width:640px;max-height:calc(var(--h,100dvh) - var(--st) - 24px);display:flex;flex-direction:column;background:var(--bg);border-radius:var(--r3) var(--r3) 0 0;box-shadow:var(--sh);padding:0 var(--sr) 0 var(--sl);animation:sheetin var(--slow) var(--ease)}
[data-theme=dark] .sheet{background:var(--bg2)}
@keyframes sheetin{from{transform:translateY(100%)}}
.sheet.out{transform:translateY(105%);transition:transform .18s ease-in}
.sheet.full{height:calc(var(--h,100dvh) - var(--st) - 12px)}
.sheet.dialog{max-width:420px}
.grab{flex:none;height:20px;display:grid;place-items:center;touch-action:none}
.grab::before{content:"";width:36px;height:5px;border-radius:3px;background:var(--fill2)}
.shead{flex:none;display:flex;align-items:center;gap:8px;padding:0 8px 6px 20px;touch-action:none}
.shead h2{flex:1;min-width:0;font-size:var(--t18);font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.shead .sub2{display:block;font-size:var(--t13);font-weight:400;color:var(--tx3);margin-top:2px}
.sbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px 16px}
.sfoot{flex:none;display:flex;gap:8px;padding:8px 20px calc(max(var(--sb),12px) + 4px)}
.sfoot>.btn{flex:1 1 auto;white-space:nowrap}
.shead h2 .mono{font-size:var(--t16);font-weight:600}
html.kb .sfoot{padding-bottom:12px}
.list{display:flex;flex-direction:column;border-radius:var(--r2);background:var(--fill);overflow:hidden}
[data-theme=dark] .list{background:var(--fill)}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;width:100%;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:46px;right:0;border-top:1px solid var(--line)}
.row.flat+.row.flat::before{left:14px}
.row:active:not(:disabled){background:var(--fill2)}
.row:disabled{opacity:.45}
.row .ri{color:var(--tx3)}
.row .ck{color:var(--ac)}
.row.bad{color:var(--er)}
.row.bad .ri{color:var(--er)}
.row .val{color:var(--tx3);font-size:var(--t14);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.row[aria-checked=true] .rm{font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:var(--t14);line-height:1.45}
.kv dt{color:var(--tx3)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec2{margin:20px 2px 8px;font-size:var(--t13);font-weight:600;color:var(--tx3)}
.sec2:first-child{margin-top:4px}
.sw{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 14px;font-size:var(--t16)}
.sw>span{flex:1;min-width:0}
.sw small{display:block;font-size:var(--t13);color:var(--tx3);line-height:1.35}
.sw+.sw{border-top:1px solid var(--line)}
.sw input{appearance:none;-webkit-appearance:none;flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;margin:0;cursor:pointer;transition:background var(--fast)}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform var(--fast) var(--ease)}
.sw input:checked{background:var(--ok)}
[data-theme=dark] .sw input:checked{background:#2fa866}
.sw input:checked::after{transform:translateX(20px)}
.sw input:disabled{opacity:.4}

@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.spin{animation-duration:1.4s!important;animation-iteration-count:infinite!important}.sheet{animation:fade var(--fast)!important}}

/* transcript */
.b{min-width:0}
.b+.b{margin-top:16px}
.b.tl+.b.tl,.b.tl+.b.q,.b.q+.b.tl,.b.q+.b.q{margin-top:2px}

<script>

  const next = () => ask(MC.queries.toolOutput(b.call_id, off), r => {
    if (!r.ok) { o.loading = false; o.err = MC.errorText(r.error); return m.refresh(); }
    parts.push(r.data.text); off = r.data.next_offset; pages++;
    if (!r.data.eof && pages < 64) return next();
    Object.assign(o, { text: parts.join('').replace(/\n$/, ''), full: true, loading: false, capped: !r.data.eof });
    m.refresh();
  });
  next();
}
function compactNow(done) {
  confirmSheet({ title: 'Compact the context now?', text: 'MiniCore summarises earlier turns to free context. The transcript stays as it is.', label: 'Compact', needsOnline: true,
    ok: m => { m.close(true); intent(MC.intents.compact(), a => { if (!a.ok) toast(MC.errorText(a.error), 'error'); else if (done) done(); }); } });
}
function exportSession() { share(S.state.session.title || 'MiniCore session', MC.exportMd(S.state, S.blocks)); }
// Find in the loaded transcript: matches are highlighted in place (CSS highlights), folds holding one open.
const fd = { on: false, q: '', ranges: [], k: 0 };
let findT = 0;
function openFind() {
  fd.on = true;
  renderBanners();
  const i = $('findq');
  i.focus(); i.select();
}
function closeFind() {
  fd.on = false; fd.q = ''; fd.ranges = [];
  if (window.CSS && CSS.highlights) { CSS.highlights.delete('find'); CSS.highlights.delete('findc'); }
  renderBanners();
}
function findBar() {
  const n = fd.ranges.length;
  return h('div', { class: 'banner find', role: 'search' }, icon('search', 'sm'),
    h('input', { id: 'findq', type: 'search', class: 'fq', value: fd.q, placeholder: 'Find in session', 'aria-label': 'Find in session', 'data-k': 'findq', autocomplete: 'off', enterKeyHint: 'search',
      oninput: e => { fd.q = e.target.value; clearTimeout(findT); findT = setTimeout(runFind, 150); },
      onkeydown: e => { if (e.key === 'Enter') { e.preventDefault(); findStep(e.shiftKey ? -1 : 1); } else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeFind(); } } }),
    h('span', { class: 'fc', 'aria-live': 'polite' }, fd.q ? (n ? fd.k + 1 + '/' + n : 'No matches') : ''),
    h('button', { class: 'ib s', type: 'button', 'aria-label': 'Previous match', disabled: !n, onclick: () => findStep(-1) }, icon('chevu', 'sm')),
    h('button', { class: 'ib s', type: 'button', 'aria-label': 'Next match', disabled: !n, onclick: () => findStep(1) }, icon('chevd', 'sm')),
    h('button', { class: 'ib s', type: 'button', 'aria-label': 'Close find', onclick: closeFind }, icon('x', 'sm')));
}
function runFind() {
  // Open the folds, groups and tool rows that hold a match, then collect ranges from the rendered text.
  for (const i of MC.findBlocks(S.blocks, fd.q, lo, hi)) {
    const r = roles[i - lo], b = S.blocks[i];
    if (r && r.f) ov.set(r.f.key, true);
    if (r && r.g) ov.set(r.g.key, true);
    if (b.type === 'tool' && !b.detail.toLowerCase().includes(fd.q.toLowerCase())) ov.set('t' + b.call_id, true);
    dirty.add(i);
  }
  flush();
  const q = fd.q.toLowerCase(), ranges = [];
  if (q) {
    const w = document.createTreeWalker(box, NodeFilter.SHOW_TEXT, { acceptNode: t => t.parentElement.closest('[hidden]') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    while (w.nextNode()) {
      const t = w.currentNode, s = t.data.toLowerCase();
      for (let k = s.indexOf(q); k >= 0; k = s.indexOf(q, k + q.length)) { const r = new Range(); r.setStart(t, k); r.setEnd(t, k + q.length); ranges.push(r); }
    }
  }
  fd.ranges = ranges; fd.k = Math.max(0, ranges.length - 1);
  paintFind();
}
function findStep(d) { if (fd.ranges.length) { fd.k = (fd.k + d + fd.ranges.length) % fd.ranges.length; paintFind(); } }
function paintFind() {
  const r = fd.ranges[fd.k];
  if (window.CSS && CSS.highlights) {
    CSS.highlights.set('find', new Highlight(...fd.ranges));
    if (r) CSS.highlights.set('findc', new Highlight(r)); else CSS.highlights.delete('findc');
  }
  if (r) { const y = r.getBoundingClientRect().top - log.getBoundingClientRect().top; log.scrollTop += y - log.clientHeight / 3; }
  renderBanners();
}
function openHelp() {}

// ---- lifecycle ----
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else wake(Date.now() - hiddenAt > 10000); syncWake(); });
// A page restored from the back/forward cache lost its socket; focus catches resumes that fire no visibility change.
addEventListener('pageshow', e => { if (e.persisted) wake(true); });
addEventListener('focus', () => wake(false));
addEventListener('online', () => { renderConn(); wake(false); });
addEventListener('offline', renderConn);
// Chromium's install prompt waits for the Settings row.
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; refreshSheets(); });
addEventListener('appinstalled', () => { installPrompt = null; refreshSheets(); });
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('/sw.js');
if (window.visualViewport) {
  // iOS keeps the layout viewport under the keyboard; fixed bottom sheets are lifted by the part it covers.
  const fit = () => {
    if (window.scrollY) scrollTo(0, 0);
    const root = document.documentElement, kb = Math.max(0, Math.round(innerHeight - visualViewport.height - visualViewport.offsetTop));
    root.style.setProperty('--h', visualViewport.height + 'px');
    root.style.setProperty('--kb', kb + 'px');
    root.classList.toggle('kb', kb > 80);
    if (stick && pinned) log.scrollTop = log.scrollHeight;
  };
  visualViewport.addEventListener('resize', fit);
  visualViewport.addEventListener('scroll', fit);
  fit();
}
buildNav();
if (localStorage.getItem(KEY)) { connecting(); connect(); } else signinScreen();
</script>

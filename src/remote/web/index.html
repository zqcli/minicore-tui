<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `default` keeps the page below the iOS status bar; `black-translucent` would draw white status text over the light theme. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MiniCore">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" id="tc" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" id="tcd" content="#0e0f12" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>MiniCore</title>
<style>
:root{
  --bg:#fff;--bg2:#f6f7f9;--sf:#fff;--fill:#f2f3f5;--fill2:#e7e9ed;--bd:rgba(17,19,23,.08);--bd2:rgba(17,19,23,.14);
  --tx:#14161a;--tx2:#5d636e;--tx3:#8d929b;--ac:#2f6bff;--ac2:#2557d9;--acs:rgba(47,107,255,.1);--on:#fff;
  --ok:#139d4f;--oks:rgba(19,157,79,.12);--wa:#a86400;--was:rgba(214,138,0,.13);--er:#d9353a;--ers:rgba(217,53,58,.1);
  --ub:#edf2ff;--glass:rgba(255,255,255,.84);--acb:#2f6bff;--banbg:#fbf0dc;--scrim:rgba(10,12,16,.38);--sh:0 8px 28px rgba(17,19,23,.12),0 1px 3px rgba(17,19,23,.06);
  --add:rgba(19,157,79,.12);--del:rgba(217,53,58,.1);--addt:#0d7a3c;--delt:#b8262b;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--r:14px;--ease:cubic-bezier(.2,.8,.2,1);
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--sl:env(safe-area-inset-left);--sr:env(safe-area-inset-right);
  color-scheme:light
}
[data-theme=dark]{color-scheme:dark;
  --bg:#0e0f12;--bg2:#141519;--sf:#17191d;--fill:#1d1f24;--fill2:#272a30;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);
  --tx:#ececef;--tx2:#a3a7b0;--tx3:#6f747d;--ac:#5b8cff;--ac2:#7aa2ff;--acs:rgba(91,140,255,.16);--on:#fff;
  --ok:#3ccf83;--oks:rgba(60,207,131,.14);--wa:#f0b44c;--was:rgba(240,180,76,.14);--er:#ff6b6b;--ers:rgba(255,107,107,.13);
  --ub:#1f2940;--glass:rgba(14,15,18,.8);--acb:#3a6cf0;--banbg:#2b2416;--scrim:rgba(0,0,0,.55);--sh:0 10px 32px rgba(0,0,0,.5),0 1px 3px rgba(0,0,0,.4);
  --add:rgba(60,207,131,.13);--del:rgba(255,107,107,.13);--addt:#5fe0a0;--delt:#ff8f8f
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Controls and bars do not select or open the iOS callout on a long press; message text still does. */
button,#bar,#banner,#chip,.dhead,.dfoot,.dsec,.shead{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--tx);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;border-radius:0;touch-action:manipulation}
button:disabled{cursor:default}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:8px}
input:focus-visible,textarea:focus-visible,[tabindex="-1"]:focus-visible{outline:none}
input::-ms-reveal,input::-ms-clear{display:none}
.mono,code,pre{font-family:var(--mono)}
.ic{width:20px;height:20px;flex:none;display:block}
.ic.sm{width:16px;height:16px}.ic.xs{width:14px;height:14px}.ic.lg{width:28px;height:28px}
.spin{width:16px;height:16px;flex:none;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite;opacity:.85}
.spin.sm{width:12px;height:12px;border-width:1.75px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-100% 0}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:44px;padding:0 var(--s4);border-radius:12px;font-size:16px;font-weight:600;background:var(--fill);color:var(--tx);transition:background .15s,opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.45}
.btn.primary{background:var(--acb);color:var(--on)}
.btn.primary:active:not(:disabled){background:var(--ac2)}
.btn.danger{background:none;color:var(--er);box-shadow:inset 0 0 0 1.5px var(--er)}
.btn.ghost{background:none;color:var(--ac);font-weight:500}
.btn.block{width:100%;min-height:50px;border-radius:14px}
.btn.sm{min-height:34px;padding:0 var(--s3);font-size:14px;border-radius:10px}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--tx);flex:none;transition:background .15s}
.ib:active{background:var(--fill)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 var(--s4);border-radius:18px;background:var(--fill);color:var(--tx2);font-size:14px;font-weight:500}
.seg{display:flex;gap:2px;padding:2px;border-radius:11px;background:var(--fill);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;min-height:36px;padding:0 var(--s3);border-radius:9px;font-size:14px;font-weight:500;color:var(--tx2);white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,color .15s}
.seg button[aria-checked=true]{background:var(--sf);color:var(--tx);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme=dark] .seg button[aria-checked=true]{background:var(--fill2)}
.seg.sm button{min-height:30px;font-size:13px;padding:0 10px}
input.tf{width:100%;min-height:44px;padding:0 var(--s3);border-radius:12px;border:1px solid var(--bd2);background:var(--sf);font-size:16px;color:var(--tx)}
input.tf:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}

/* screens */
.screen{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;overflow-y:auto;padding:calc(var(--st) + 24px) calc(var(--sr) + 24px) calc(var(--sb) + 24px) calc(var(--sl) + 24px);background:var(--bg)}
.screen>.col{width:100%;max-width:360px;margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;animation:rise .22s var(--ease)}
.appicon{width:72px;height:72px;border-radius:18px;box-shadow:0 0 0 .5px var(--bd2),0 8px 24px rgba(47,107,255,.22);margin-bottom:var(--s5)}
.screen h1{margin:0 0 6px;font-size:24px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.screen .sub{margin:0;color:var(--tx2);font-size:15px;overflow-wrap:anywhere}
.screen .sub b{color:var(--tx);font-weight:600}
.note{display:flex;gap:var(--s2);align-items:flex-start;text-align:left;width:100%;margin-top:var(--s5);padding:var(--s3) 14px;border-radius:12px;background:var(--acs);color:var(--tx);font-size:14px;line-height:1.4}
.note .ic{color:var(--ac);margin-top:1px}
#sf{width:100%;margin-top:var(--s6);text-align:left}
#sf label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin:0 0 6px 4px}
.field{display:flex;align-items:center;height:54px;border-radius:14px;border:1px solid var(--bd2);background:var(--sf);transition:border-color .15s,box-shadow .15s}
.field:focus-within{border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.field.bad{border-color:var(--er);box-shadow:0 0 0 4px var(--ers)}
.field.shake{animation:shake .32s ease}
.field input{flex:1;min-width:0;height:100%;border:0;background:none;padding:0 0 0 var(--s4);font-size:17px;letter-spacing:.02em}
.field input::placeholder{color:var(--tx3);letter-spacing:0}
.field .ib{color:var(--tx3);margin-right:5px}
.ferr{display:flex;gap:6px;align-items:flex-start;margin:var(--s2) 4px 0;font-size:14px;line-height:1.4;color:var(--er)}
.ferr.warn{color:var(--wa)}
.ferr .ic{margin-top:1px}
.ferr button{color:var(--ac);font-weight:600;margin-left:auto;min-height:24px;padding-left:var(--s2)}
#sgo{margin-top:var(--s5)}
.help{margin:var(--s4) 4px 0;font-size:13px;line-height:1.45;color:var(--tx3);text-align:center}
.eicon{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:var(--fill);color:var(--tx2);margin-bottom:var(--s5)}
.eicon.warn{background:var(--was);color:var(--wa)}
.eicon.ac{background:var(--acs);color:var(--ac)}
.gate-acts{display:flex;flex-direction:column;gap:var(--s2);width:100%;margin-top:var(--s6)}
.screen .spin{width:22px;height:22px;color:var(--tx3);margin-top:var(--s5)}

/* main */
#main{position:fixed;inset:0;overflow:hidden;height:var(--h,100dvh);display:flex;flex-direction:column}
#bar{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;align-items:center;gap:var(--s1);height:calc(var(--st) + 52px);padding:var(--st) calc(var(--sr) + 6px) 0 calc(var(--sl) + 6px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--bd)}
#ttl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
#title{max-width:100%;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub{display:flex;align-items:center;gap:3px;max-width:100%;min-height:22px;padding:0 6px;margin-top:1px;border-radius:8px;color:var(--tx2);font-size:12.5px;line-height:1.3}
#sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sub:active{background:var(--fill)}
#sub .ic{opacity:.7}
#banner{position:absolute;left:0;right:0;top:calc(var(--st) + 52px);z-index:5;display:flex;align-items:center;justify-content:center;gap:var(--s2);height:30px;font-size:13px;font-weight:500;color:var(--wa);background:var(--banbg);box-shadow:0 .5px 0 var(--bd);transform:translateY(-100%);opacity:0;visibility:hidden;transition:transform .2s var(--ease),opacity .2s,visibility .2s}
#banner.on{transform:none;opacity:1;visibility:visible}
#chip{position:absolute;top:calc(var(--st) + 60px);left:0;right:0;margin:0 auto;width:max-content;z-index:5;display:flex;align-items:center;gap:6px;max-width:calc(100% - 32px);height:32px;padding:0 14px 0 12px;border-radius:16px;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--sh),inset 0 0 0 .5px var(--bd2);font-size:13px;font-weight:600;color:var(--tx2);white-space:nowrap;animation:rise .18s var(--ease)}
#chip span{overflow:hidden;text-overflow:ellipsis}
#chip .warn{color:var(--wa);display:inline-flex;align-items:center;gap:4px}
#chip .sep{color:var(--tx3);font-weight:400}
#main.haschip #log{padding-top:calc(var(--st) + 52px + 56px)}
.pulse{width:8px;height:8px;flex:none;border-radius:50%;background:var(--ac);box-shadow:0 0 0 0 var(--acs);animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ac)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
#banner .spin{width:12px;height:12px;border-width:1.75px}
#mid{flex:1;min-height:0;position:relative}
#log{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:calc(var(--st) + 52px + var(--s4)) calc(var(--sr) + var(--s4)) calc(var(--pad,0px) + var(--s4)) calc(var(--sl) + var(--s4))}
#col{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
#top{display:flex;flex-direction:column;align-items:center;gap:var(--s2)}
#top:not(:empty){margin-bottom:var(--s4)}
#blocks{display:flex;flex-direction:column}
#blocks>*{min-width:0}
#down{position:absolute;right:calc(var(--sr) + var(--s4));bottom:var(--s3);z-index:4;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--sf);color:var(--tx);box-shadow:var(--sh);border:.5px solid var(--bd);animation:rise .18s var(--ease)}
#down .dot{position:absolute;top:2px;right:2px;width:10px;height:10px;border-radius:50%;background:var(--ac);border:2px solid var(--sf);display:none}
#down.new .dot{display:block}
#toasts{position:absolute;left:var(--s4);right:var(--s4);bottom:var(--s3);z-index:8;display:flex;flex-direction:column;align-items:center;gap:var(--s2);pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:var(--s2);max-width:min(100%,480px);min-height:44px;padding:var(--s2) var(--s2) var(--s2) 14px;border-radius:14px;background:var(--tx);color:var(--bg);font-size:14px;line-height:1.4;box-shadow:var(--sh);animation:rise .18s var(--ease);overflow-wrap:anywhere}
.toast:not(.error){padding-right:14px}
.toast.error{background:var(--sf);color:var(--tx);box-shadow:var(--sh),inset 0 0 0 1px var(--bd)}
.toast.error>.ic{color:var(--er)}
.toast span{flex:1}
.toast .ib{width:32px;height:32px;color:inherit;opacity:.6}
.toast.attn{background:var(--sf);color:var(--tx);box-shadow:var(--sh),inset 0 0 0 1.5px var(--wa)}
.toast.attn>.ic{color:var(--wa)}
.toast.act{padding-right:var(--s2)}
.tact{flex:none;min-height:32px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:650;color:inherit;background:rgba(128,128,128,.22)}
.toast.attn .tact{background:var(--acb);color:#fff}

/* messages */
.msg{margin:0 0 var(--s5)}
.user{display:flex;flex-direction:column;align-items:flex-end}
.ulbl{display:flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--ac);margin:0 6px 4px}
.bubble{max-width:85%;padding:10px 14px;border-radius:20px;background:var(--ub);white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}
.user.steer .bubble{background:var(--acs);box-shadow:inset 0 0 0 1px var(--acs)}
.asst{display:flex;flex-direction:column;align-items:flex-start}
.think{margin:0 0 var(--s2);max-width:100%}
.asst.bare{margin-bottom:var(--s3)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px 0 8px;margin-left:-8px;border-radius:10px;font-size:14px;font-weight:500;color:var(--tx2)}
.chip:active{background:var(--fill)}
.chip .ic.sp{color:var(--ac);opacity:.8}
.chip .ic.cv{transition:transform .18s var(--ease);opacity:.6}
.chip[aria-expanded=true] .ic.cv{transform:rotate(90deg)}
.chip.live span{background:linear-gradient(90deg,var(--tx2) 0,var(--tx2) 40%,var(--tx) 50%,var(--tx2) 60%,var(--tx2) 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 1.6s linear infinite}
.reason{margin:2px 0 var(--s2);padding:2px 0 2px var(--s3);border-left:2px solid var(--bd2);color:var(--tx2);font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;gap:2px;margin:2px 0 0 -10px}
.acts .ib{width:36px;height:36px;color:var(--tx3);border-radius:10px}
.acts .ib.done{color:var(--ok)}
.md{width:100%;overflow-wrap:anywhere;line-height:1.6}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .75em}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:1.1em 0 .45em;line-height:1.3;font-weight:650;letter-spacing:-.005em}
.md h1{font-size:1.3em}.md h2{font-size:1.18em}.md h3{font-size:1.06em}.md h4,.md h5,.md h6{font-size:1em}
.md ul,.md ol{margin:0 0 .75em;padding-left:1.5em}
.md li{margin:.2em 0}.md li::marker{color:var(--tx3)}
.md li>ul,.md li>ol{margin:.2em 0 0}
.md code{font-size:.86em;padding:.12em .38em;border-radius:6px;background:var(--fill);overflow-wrap:anywhere}
.md a{color:var(--ac);text-decoration:underline;text-decoration-color:var(--acs);text-underline-offset:2px}
.md blockquote{margin:0 0 .75em;padding:0 0 0 var(--s3);border-left:3px solid var(--bd2);color:var(--tx2)}
.md hr{border:0;height:1px;background:var(--bd2);margin:1.25em 0}
.md del{color:var(--tx3)}
.cb{margin:0 0 .85em;border-radius:12px;background:var(--bg2);box-shadow:inset 0 0 0 1px var(--bd);overflow:hidden;max-width:100%}
.cbh{display:flex;align-items:center;justify-content:space-between;height:34px;padding:0 4px 0 var(--s3);font:12px var(--mono);color:var(--tx3);box-shadow:0 1px 0 var(--bd)}
.cbh button{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 var(--s2);border-radius:8px;font:500 12px var(--font);color:var(--tx2)}
.cbh button:active{background:var(--fill)}
.cbh button.done{color:var(--ok)}
.cb pre{margin:0;padding:var(--s3);overflow-x:auto;font-size:13px;line-height:1.55;white-space:pre;-webkit-overflow-scrolling:touch}
.cb code{background:none;padding:0;font-size:inherit;border-radius:0;overflow-wrap:normal}
.tw{margin:0 0 .85em;overflow-x:auto;border-radius:12px;box-shadow:inset 0 0 0 1px var(--bd);max-width:100%}
.tw table{border-collapse:collapse;font-size:14px;line-height:1.45;min-width:100%}
.tw th,.tw td{padding:8px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--bd);white-space:nowrap}
.tw th{background:var(--bg2);font-weight:600;font-size:13px;color:var(--tx2)}
.tw tr:last-child td{border-bottom:0}
.caret{display:inline-block;width:.5em;height:1.05em;margin-left:2px;vertical-align:-.15em;border-radius:2px;background:var(--tx);opacity:.75;animation:blink 1s steps(1) infinite}

/* tool activity */
.tl{margin:0;background:var(--sf);box-shadow:inset 1px 0 0 var(--bd),inset -1px 0 0 var(--bd)}
.tl.first{border-radius:var(--r) var(--r) 0 0;box-shadow:inset 0 1px 0 var(--bd),inset 1px 0 0 var(--bd),inset -1px 0 0 var(--bd)}
.tl.last{border-radius:0 0 var(--r) var(--r);box-shadow:inset 0 -1px 0 var(--bd),inset 1px 0 0 var(--bd),inset -1px 0 0 var(--bd);margin-bottom:var(--s5);padding-bottom:4px}
.tl.first.last{border-radius:var(--r);box-shadow:inset 0 0 0 1px var(--bd);padding-bottom:0}
[data-theme=dark] .tl{background:var(--bg2)}
.ghead{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:var(--s2) var(--s3) var(--s2) 14px;text-align:left}
.gic{width:28px;height:28px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--fill);color:var(--tx2)}
.gic.ok{background:var(--oks);color:var(--ok)}.gic.er{background:var(--ers);color:var(--er)}.gic.run{background:var(--acs);color:var(--ac)}
.gtx{flex:1;min-width:0;display:flex;flex-direction:column}
.gsum{font-size:14.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gdet .er{color:var(--er);font-family:var(--font);font-weight:500}
.gdet{font-size:12.5px;line-height:1.4;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font-size:12.5px;color:var(--tx3);flex:none;font-variant-numeric:tabular-nums}
.gmeta.er{color:var(--er)}
.ghead .cv,.trow .cv{color:var(--tx3);transition:transform .18s var(--ease)}
.ghead[aria-expanded=true] .cv,.trow[aria-expanded=true] .cv{transform:rotate(90deg)}
.tl.first.open .ghead{box-shadow:0 1px 0 var(--bd)}
.trow{display:flex;align-items:center;gap:var(--s2);width:100%;min-height:44px;padding:0 var(--s3) 0 14px;text-align:left;font-size:14px}

<section id="signin" class="screen" hidden>
  <div class="col">
    <img class="appicon" src="/icon.svg" alt="" width="72" height="72">
    <h1>Connect to MiniCore</h1>
    <p class="sub">on <b id="shost"></b></p>
    <div id="snote" class="note" role="status" hidden><svg class="ic sm"><use href="#i-info"/></svg><span></span></div>
    <form id="sf" novalidate>
      <label for="pw">Password</label>
      <div class="field" id="pwf">
        <input id="pw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="xxxx-xxxx-xxxx" aria-describedby="serr shelp">
        <button type="button" id="pweye" class="ib" aria-label="Show password" aria-pressed="false"><svg class="ic"><use href="#i-eye"/></svg></button>
      </div>
      <div id="serr" class="ferr" role="alert" hidden></div>
      <button id="sgo" class="btn primary block" type="submit"><span class="spin" hidden></span><span>Connect</span></button>
      <p class="help" id="shelp">The password is shown on your computer's MiniCore screen.</p>
    </form>
  </div>
</section>

<section id="gate" class="screen" hidden></section>

<div id="main" hidden>
  <header id="bar">
    <button id="menu" class="ib" type="button" aria-label="Sessions" aria-haspopup="dialog"><svg class="ic"><use href="#i-menu"/></svg></button>
    <div id="ttl">
      <div id="title">MiniCore</div>
      <button id="sub" type="button" aria-label="Model and reasoning" aria-haspopup="dialog"><span id="subtxt"></span><svg class="ic xs"><use href="#i-chevd"/></svg></button>
    </div>
    <button id="rename" class="ib" type="button" aria-label="Rename session" aria-haspopup="dialog"><svg class="ic"><use href="#i-edit"/></svg></button>
  </header>
  <button id="chip" type="button" aria-haspopup="dialog" hidden></button>
  <div id="banner" role="status" aria-live="polite"><span class="spin"></span><span id="bantxt">Reconnecting…</span></div>
  <div id="mid">
    <main id="log" aria-label="Conversation">
      <div id="col">
        <div id="top"></div>
        <div id="blocks"></div>
        <div id="empty" hidden></div>
      </div>
    </main>
    <button id="down" type="button" aria-label="Scroll to bottom" hidden><svg class="ic"><use href="#i-down"/></svg><span class="dot"></span></button>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <footer id="dock">
    <div id="strip" hidden></div>
    <div id="tray"></div>
    <div id="modes" class="seg sm" role="radiogroup" aria-label="When to send" hidden>
      <button type="button" role="radio" data-mode="submit" aria-checked="true"><svg class="ic xs"><use href="#i-steer"/></svg>Steer now</button>
      <button type="button" role="radio" data-mode="queue" aria-checked="false">Queue next</button>
    </div>
    <form id="comp">
      <textarea id="ta" rows="1" placeholder="Message MiniCore" aria-label="Message"></textarea>
      <button id="act" type="submit" aria-label="Send"></button>
    </form>
  </footer>
</div>
<div id="ascrim"></div>
<section id="appr" class="sheet" role="dialog" aria-labelledby="atitle" inert></section>
<div id="scrim"></div>

<div id="scrim2"></div>
<section id="dlg" class="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle" tabindex="-1" inert></section>

<script>
'use strict';
// ---- UI: DOM only; decisions come from MC ----
const S = MC.createStore(), HOST = location.host, KEY = 'minicore.token', NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const flat = k => k.flat(Infinity).filter(x => x != null && x !== false && x !== '');
function h(tag, p, ...kids) {
  const n = document.createElement(tag);
  if (typeof p === 'string') n.className = p;
  else if (p) for (const k in p) {
    const v = p[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k in n && !k.includes('-') && k !== 'spellcheck') n[k] = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...flat(kids));
  return n;
}
function icon(name, cls) {
  const s = document.createElementNS(NS, 'svg'), u = document.createElementNS(NS, 'use');
  s.setAttribute('class', 'ic' + (cls ? ' ' + cls : ''));
  s.setAttribute('aria-hidden', 'true');
  u.setAttribute('href', '#i-' + name);
  s.append(u);
  return s;
}
const fill = (n, ...k) => n.replaceChildren(...flat(k));
const spin = cls => h('span', 'spin' + (cls ? ' ' + cls : ''));
const tz = () => new Date().getTimezoneOffset();
const hostNow = () => Date.now() + S.skew;
const st = () => S.state.status;
const cur = () => S.state.session || S.state.draft;

// ---- copy (navigator.clipboard is missing on plain-http LAN pages) ----
function copyText(text, btn) {
  const done = () => { if (btn) { btn.classList.add('done'); setTimeout(() => btn.classList.remove('done'), 1500); } toast('Copied'); };
  const legacy = () => {
    const t = h('textarea', { value: text, readOnly: true, style: 'position:fixed;top:0;left:0;opacity:0;font-size:16px' });
    document.body.append(t);
    t.select(); t.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand('copy'); } catch { ok = false; }
    t.remove();
    ok ? done() : toast("Couldn't copy on this page", 'error');
  };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, legacy); else legacy();
}

// ---- toasts ----
// Errors and attention toasts stay until dismissed; an action ("Open") removes the toast and runs.
function toast(text, level, act) {
  const box = $('toasts'), sticky = level === 'error' || level === 'attn';
  const n = h('div', { class: 'toast' + (sticky ? ' ' + level : '') + (act ? ' act' : ''), role: sticky ? 'alert' : 'status' }, sticky && icon('warn', 'sm'), h('span', '', text),
    act && h('button', { class: 'tact', type: 'button', onclick: () => { n.remove(); act.fn(); } }, act.label),
    sticky && h('button', { class: 'ib', type: 'button', 'aria-label': 'Dismiss', onclick: () => n.remove() }, icon('x', 'sm')));
  box.append(n);
  while (box.children.length > 3) box.firstChild.remove();
  if (!sticky) setTimeout(() => n.remove(), act ? 6000 : 3500);
  return n;
}

// ---- screens ----
let screen = '';
function show(name) {
  screen = name;
  $('signin').hidden = name !== 'signin';
  $('gate').hidden = name !== 'gate';
  $('main').hidden = name !== 'main';
  if (name !== 'main') { closeDlg(); closeModal(); renderAppr(); }
}
function gateScreen(g) {
  const eicon = h('div', 'eicon' + (g.icon === 'warn' ? ' warn' : ''), icon(g.icon, 'lg'));
  fill($('gate'), h('div', 'col', g.spinner ? h('img', { class: 'appicon', src: '/icon.svg', alt: '' }) : eicon, h('h1', '', g.title), g.text && h('p', 'sub', g.text),
    g.spinner && spin(), g.action && h('div', 'gate-acts', h('button', { class: 'btn primary block', type: 'button', onclick: g.onAction || (() => gateAction(g.action)) }, g.label),
      g.signin && h('button', { class: 'btn ghost', type: 'button', onclick: signOut }, 'Sign in with a password'))));
  show('gate');
}
function gateAction(a) {
  if (a === 'reload') location.reload();
  else { halted = false; attempt = 0; connecting(); connect(); }
}
function connecting() {
  if (S.state) return show('main');
  gateScreen(attempt < 2
    ? { spinner: true, title: 'Connecting…', text: HOST }
    : { icon: 'cloudoff', title: MC.unreachable(HOST), text: 'Check that MiniCore is running with remote control on and that this device can reach your computer. Retrying…', action: 'retry', label: 'Retry now', signin: true });
}

// ---- sign-in ----
let lockUntil = 0, lockT = 0;
function signinScreen(o = {}) {
  show('signin');
  $('shost').textContent = HOST;
  const note = $('snote');
  note.hidden = !o.notice;
  if (o.notice) note.lastChild.textContent = o.notice;
  signinBusy(false);
  if (o.locked) lock(o.locked);
  else if (o.error) signinError(o.error, o);
  else if (!lockT) signinError('');
  const pw = $('pw');
  if (o.shake) { const f = $('pwf'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); }
  if (o.error || o.shake) { pw.focus(); pw.select(); } else if (!o.notice) pw.focus({ preventScroll: true });
}
function signinError(text, o = {}) {
  const e = $('serr');
  $('pwf').classList.toggle('bad', !!text && !o.warn && !o.retry);
  e.hidden = !text;
  e.className = 'ferr' + (o.warn ? ' warn' : '');
  fill(e, text && icon(o.warn ? 'info' : 'warn', 'sm'), h('span', '', text), o.retry && h('button', { type: 'button', onclick: doLogin }, 'Retry'));
}
function signinBusy(on) {
  const b = $('sgo');
  b.firstChild.hidden = !on;
  b.lastChild.textContent = on ? 'Connecting…' : 'Connect';
  b.disabled = on || Date.now() < lockUntil;
  $('pw').readOnly = on;
}
function lock(sec) {
  lockUntil = Date.now() + sec * 1000;
  clearInterval(lockT);
  const step = () => {
    const left = Math.ceil((lockUntil - Date.now()) / 1000);
    if (left <= 0) { clearInterval(lockT); lockT = 0; lockUntil = 0; signinError('You can try again now.', { warn: true }); signinBusy(false); return; }
    signinError(MC.lockText(left), { warn: true });
    $('sgo').disabled = true;
  };
  lockT = setInterval(step, 1000);
  step();
}
function doLogin() {
  const pw = $('pw').value;
  if (!pw.trim()) { signinError('Enter the password shown on your computer.'); $('pw').focus(); return; }
  if (Date.now() < lockUntil) return;
  signinError('');
  signinBusy(true);
  halted = false;
  open(() => MC.login(pw, MC.deviceName(navigator.userAgent, navigator.maxTouchPoints)), 'login');
}
$('sf').addEventListener('submit', e => { e.preventDefault(); doLogin(); });
$('pw').addEventListener('input', () => { if (!lockT) signinError(''); });
$('pweye').addEventListener('click', () => {
  const pw = $('pw'), b = $('pweye'), vis = pw.type === 'password';
  pw.type = vis ? 'text' : 'password';
  b.setAttribute('aria-pressed', vis);
  b.setAttribute('aria-label', vis ? 'Hide password' : 'Show password');
  b.firstChild.firstChild.setAttribute('href', vis ? '#i-eyeoff' : '#i-eye');
});
function signOut() {
  localStorage.removeItem(KEY);
  halted = true;
  drop();
  resetSession();
  signinScreen({ notice: 'Signed out of this device. Enter the password to connect again.' });
}

// ---- connection ----
let ws = null, ready = false, halted = false, attempt = 0, retryT = 0, how = 'hello', hiddenAt = 0;
const online = () => ready && ws && ws.readyState === 1;
function send(msg) { ws.send(JSON.stringify(msg)); }
function drop() {
  clearTimeout(retryT);
  if (ws) { const s = ws; ws = null; s.onclose = s.onmessage = null; s.close(); lost(); }
}
function open(first, kind) {
  drop();
  how = kind;
  const s = ws = new WebSocket((location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + HOST + '/ws');
  s.onopen = () => s.send(JSON.stringify(first()));
  s.onmessage = e => onMessage(JSON.parse(e.data));
  s.onclose = () => { if (ws === s) { ws = null; lost(); closed(); } };
}
function connect() {
  const token = localStorage.getItem(KEY);
  if (!token) return signinScreen();
  open(() => MC.hello(token), 'hello');
  renderConn();
}
function lost() {
  ready = false;
  MC.disconnect(S);
  fsWait.clear();
  if (ns) { ns.busy = false; ns.starting = false; }
  pendingRow = null; mp.model = mp.level = null;
  if (dl && dl.busy) { dl.busy = false; dl.err = 'Connection lost. Check the session list before trying again.'; renderDlg(); }
  if (S.state) { renderTray(); renderAppr(); updateComposer(); renderModal(); }
}
function closed() {
  if (halted) return;
  if (how === 'login') { signinBusy(false); signinError(MC.unreachable(HOST), { retry: true }); return; }
  attempt++;
  if (!S.state) connecting();
  renderConn();
  retryT = setTimeout(connect, MC.backoff(attempt - 1));
}
function wake(force) {
  if (halted || screen === 'signin' || !localStorage.getItem(KEY)) return;
  if (force || !ws || ws.readyState > 1) { attempt = 0; connect(); }
}
function renderConn() {
  if (screen !== 'main') return;

      } }, d.busy && spin(), d.busy ? 'Deleting…' : 'Delete'), h('button', { class: 'btn', type: 'button', onclick: closeDlg }, 'Cancel')));
  }
  const had = document.activeElement && document.activeElement.id === 'renin';
  fill(el, h('div', 'grab'), shead('Rename session', null, 'dtitle', closeDlg),
    h('form', { class: 'dform', novalidate: true, onsubmit: e => {
      e.preventDefault();
      if (d.busy) return;
      d.err = '';
      if (intent(MC.intents.renameSession(d.id, d.value.trim()))) d.busy = true;
      renderDlg();
    } },
    h('div', 'sbody', h('input', { id: 'renin', class: 'tf', type: 'text', value: d.value, maxLength: 200, readOnly: d.busy, 'data-focus': true, 'aria-label': 'Session title',
      placeholder: 'Session title', autocomplete: 'off', enterKeyHint: 'done', 'aria-describedby': 'renhint', oninput: e => { d.value = e.target.value; } }),
      h('div', { id: 'renhint', class: 'hint' }, 'Leave empty to use the first message'), err),
    h('div', 'sfoot dbtns', h('button', { class: 'btn', type: 'button', onclick: closeDlg }, 'Cancel'),
      h('button', { class: 'btn primary', type: 'submit', disabled: d.busy || !online() }, d.busy && spin(), d.busy ? 'Saving…' : 'Save'))));
  // Keep the caret when a re-render (pending, error) replaces the field the user is typing in.
  if (had) { const i = $('renin'); i.focus({ preventScroll: true }); i.setSelectionRange(i.value.length, i.value.length); }
}

// ---- lifecycle ----
document.addEventListener('visibilitychange', () => { if (document.hidden) hiddenAt = Date.now(); else wake(Date.now() - hiddenAt > 10000); });
// A page restored from the back/forward cache lost its socket; focus catches resumes that fire no visibility change.
addEventListener('pageshow', e => { if (e.persisted) wake(true); });
addEventListener('focus', () => wake(false));
addEventListener('online', () => { renderConn(); wake(false); });
addEventListener('offline', renderConn);
// Chromium's install prompt waits for the drawer's button.
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; renderDrawerFoot(); });
addEventListener('appinstalled', () => { installPrompt = null; renderDrawerFoot(); });
if ('serviceWorker' in navigator && isSecureContext) navigator.serviceWorker.register('/sw.js');
new ResizeObserver(padLog).observe($('appr'));
if (window.visualViewport) {
  // iOS keeps the layout viewport under the keyboard; fixed bottom sheets are lifted by the part it covers.
  const fit = () => {
    if (window.scrollY) scrollTo(0, 0);
    const root = document.documentElement, kb = Math.max(0, Math.round(innerHeight - visualViewport.height - visualViewport.offsetTop));
    root.style.setProperty('--h', visualViewport.height + 'px');
    root.style.setProperty('--kb', kb + 'px');
    root.classList.toggle('kb', kb > 80);
    if (stick) log.scrollTop = log.scrollHeight;
  };
  visualViewport.addEventListener('resize', fit);
  visualViewport.addEventListener('scroll', fit);
  fit();
}
if (localStorage.getItem(KEY)) { connecting(); connect(); } else signinScreen();

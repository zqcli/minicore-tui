[package]
name = "minicore-tui"
version = "0.5.2"
edition = "2024"
description = "A pi-style coding agent TUI with minicore-agent built in, spoken to over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# The Agent is built in and runs as this executable's `agent` subcommand.
minicore-agent = { git = "https://github.com/zqcli/minicore-agent", tag = "v0.7.3", version = "0.7.3" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "process", "signal"] }
toml = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

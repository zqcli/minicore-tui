[package]
name = "minicore-tui"
version = "0.2.8"
edition = "2024"
rust-version = "1.85.0"
description = "A pi-style coding agent TUI frontend for minicore-agent over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm", "unstable-backend-writer"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
tui-textarea = { version = "=0.7.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal"] }
pulldown-cmark = { version = "=0.12.2", default-features = false }
unicode-width = "=0.2.0"
unicode-segmentation = "=1.13.3"
# Reliable unique temp files for the Markdown export (spec §17.4/§23.1).
# Pinned to a release whose MSRV is below our Rust 1.85 floor; it also
# provides the atomic no-clobber persist used to commit an export.
tempfile = "=3.14.0"
# RFC3339 parsing plus OS-local timezone conversion for Rail timestamps.
time = { version = "=0.3.45", default-features = false, features = ["std", "parsing", "local-offset"] }
icu_segmenter = { version = "=2.1.2", default-features = false, features = ["compiled_data", "auto"] }

[dev-dependencies]
toml = "=0.8.23"
url = "=2.5.4"

# Generic terminal/ANSI code is also instantiated in this package.
# Keep debug information/assertions while removing avoidable iterator overhead.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

# A scripted minicore-agent stand-in used only by the fake-agent harness in
# `src/rpc.rs` (never a `[[bin]]`, so nothing installable ships it). Bare runs
# (as part of `cargo test`) are a no-op main.
[[test]]
name = "agent_process"
path = "tests/agent_process.rs"
harness = false

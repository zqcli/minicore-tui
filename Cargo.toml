[package]
name = "minicore-tui"
version = "0.5.0"
edition = "2024"
rust-version = "1.88.0"
description = "A pi-style coding agent TUI frontend for minicore-agent over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
crossterm = "0.29"
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "process", "signal"] }
toml = "0.8"
toml_edit = "0.22"
unicode-segmentation = "1"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

[package]
name = "minicore-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "A pi-style coding agent TUI frontend for minicore-agent over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
ratatui = { version = "=0.29.0", default-features = false, features = ["crossterm"] }
crossterm = { version = "=0.28.1", features = ["event-stream"] }
tui-textarea = { version = "=0.7.0", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
pulldown-cmark = { version = "=0.12.2", default-features = false }
unicode-width = "=0.2.0"

[lints.rust]
unsafe_code = "forbid"
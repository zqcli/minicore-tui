[package]
name = "minicore-tui"
version = "0.12.2"
edition = "2024"
description = "A pi-style coding agent TUI with an embedded MiniCore Host"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
minicore-host-config = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-core = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-diagnostics = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-local-tools = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-protocol = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-resources = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-runtime = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-transport = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-workspace = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "signal", "net"] }
tracing = "0.1"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
minicore-host-provider = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
minicore-host-tools = { git = "https://github.com/zqcli/minicore-host", rev = "92dfed01e72de0a63ca0ab82bffdc5495e4a8d7b", version = "0.12.2" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

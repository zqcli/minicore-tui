[package]
name = "minicore-tui"
version = "0.7.3"
edition = "2024"
description = "A pi-style coding agent TUI with minicore-agent built in, spoken to over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
keywords = ["tui", "ratatui", "coding-agent", "jsonrpc"]
categories = ["command-line-utilities"]

[dependencies]
base64 = "0.22"
crossterm = { version = "0.29", features = ["event-stream"] }
flate2 = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
getrandom = "0.2"
httparse = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The Agent is built in and runs as this executable's `agent` subcommand.
minicore-agent = { git = "https://github.com/zqcli/minicore-agent", tag = "v0.8.1", version = "0.8.1" }
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-concatenated", "tzdb-bundle-platform"] }
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# ring, not aws-lc: aws-lc-sys needs cmake and nasm and breaks cross builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util", "process", "signal", "net"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "1"
toml_edit = "0.25"
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
unsafe_code = "forbid"

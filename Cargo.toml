[package]
name = "minicore-tui"
version = "0.4.0"
edition = "2024"
rust-version = "1.85.0"
description = "A pi-style coding agent TUI frontend for minicore-agent over stdio JSON-RPC"
license = "MIT OR Apache-2.0"
autobins = false
autotests = false

[dependencies]
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
pulldown-cmark = { version = "0.13", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"

[lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
